name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Unit tests (pure logic) + tool tests (every MCP tool driven through a
      # real MCP client against in-memory fakes). No network, no Qlik site.
      - run: npm test
      # docs/tools.md is generated from the real tools/list; fail if stale.
      # One leg is enough: the doc does not depend on OS or Node version.
      - name: docs/tools.md is current
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run docs:check
      # The published tarball must carry the built server. --ignore-scripts
      # keeps `prepare` from rebuilding, so a missing dist/ fails here.
      - name: npm pack --dry-run
        shell: bash
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const [p] = require('./pack.json');
            const files = new Set(p.files.map((f) => f.path));
            const required = ['package.json', 'dist/index.js', 'dist/server.js', 'dist/tools/index.js'];
            const missing = required.filter((f) => !files.has(f));
            if (missing.length) { console.error('missing from package: ' + missing.join(', ')); process.exit(1); }
            const stray = [...files].filter((f) => /^(src|tests|scripts)\//.test(f));
            if (stray.length) { console.error('unexpected files in package: ' + stray.join(', ')); process.exit(1); }
            console.log(p.name + '@' + p.version + ': ' + p.files.length + ' files, ' + p.size + ' bytes');
          "
      # Integration smoke (scripts/smoke.mjs) needs a live QSEoW site and
      # certificates. It runs in the release checklist, not in CI.

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm run coverage
        shell: bash
        run: |
          mkdir -p coverage
          npm run coverage | tee coverage/report.txt
          {
            echo '### Coverage (dist/)'
            echo '```'
            grep -E '^ℹ (file |all files)' coverage/report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
